<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produto</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stylecadastro.css">
</head>
<body>
  <div class="container">
    <h1>🥤 Cadastro de Produto</h1>

    <form id="formCadastro">
      <div class="form-group">
        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" placeholder="Ex: X-Burger">
      </div>

      <div class="form-group">
        <label for="preco">Preço (R$)</label>
        <input type="text" id="preco" step="0.01" placeholder="Ex: 19.90">
      </div>

      <div class="form-group">
        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" placeholder="Ex: 10">
      </div>

      <div class="actions">
        <button type="submit" class="btn">✅ Cadastrar</button>
        <button type="reset" class="btn btn-secundario">🧹 Limpar</button>
      </div>
    </form>

    <!-- Mensagem de sucesso/erro -->
    <p id="mensagem" class="mensagem"></p>
    <button class="btn" onclick="window.location.href = 'index.html'">⬅ Voltar ao Menu</button>
  </div>

  <script src="js/scriptcadastro.js"></script>
</body>
</html>
